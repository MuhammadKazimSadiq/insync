[package]
name = "vault-publisher-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
publisher-core = { path = "../crates/publisher-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0", features = ["tray-icon", "devtools"] }
tauri-plugin-dialog = "2.0"

[build-dependencies]
tauri-build = "2.0"
