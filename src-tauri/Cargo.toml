[package]
name = "vault-publisher-desktop"
version = "1.0.0"
edition = "2021"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
publisher-core = { path = "../crates/publisher-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0", features = ["image-png", "tray-icon", "devtools", "custom-protocol"] }
tauri-plugin-dialog = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[build-dependencies]
tauri-build = "2.0"
