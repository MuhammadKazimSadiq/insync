<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3440" />
      <stop offset="50%" stop-color="#242933" />
      <stop offset="100%" stop-color="#1E222A" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C566A" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3B4252" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#2E3440" stop-opacity="0.2" />
    </linearGradient>

    <!-- Upper Arrow Gradient (Nord Frost Cyan -> Sky) -->
    <linearGradient id="frostCyanSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FBCBB" />
      <stop offset="40%" stop-color="#88C0D0" />
      <stop offset="100%" stop-color="#81A1C1" />
    </linearGradient>

    <!-- Lower Arrow Gradient (Nord Frost Sky -> Cobalt) -->
    <linearGradient id="frostSkyCobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81A1C1" />
      <stop offset="60%" stop-color="#5E81AC" />
      <stop offset="100%" stop-color="#4C6D96" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="frostGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base with Shadow -->
  <rect x="44" y="44" width="424" height="424" rx="100" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" filter="url(#shadowFilter)" />

  <!-- Inner Subtle Folder Outlines (Symbolizing Folders in Sync) -->
  <g opacity="0.18">
    <!-- Source folder silhouette -->
    <path d="M 130 180 L 200 180 L 225 205 L 340 205 Q 355 205 355 220 L 355 330 Q 355 345 340 345 L 130 345 Q 115 345 115 330 L 115 195 Q 115 180 130 180 Z" fill="none" stroke="#88C0D0" stroke-width="4" stroke-dasharray="8 6" />
  </g>

  <!-- Glowing Interlocking Dual Sync Loop -->
  <g filter="url(#frostGlow)">
    <!-- Top-Right Loop Arc -->
    <path d="M 200 185 C 200 185 225 145 285 145 C 360 145 390 205 390 260 C 390 310 355 350 310 365" 
          fill="none" 
          stroke="url(#frostCyanSky)" 
          stroke-width="32" 
          stroke-linecap="round" />

    <!-- Top-Right Arrow Head -->
    <path d="M 185 155 L 210 215 L 255 180 Z" 
          fill="url(#frostCyanSky)" />

    <!-- Bottom-Left Loop Arc -->
    <path d="M 312 327 C 312 327 287 367 227 367 C 152 367 122 307 122 252 C 122 202 157 162 202 147" 
          fill="none" 
          stroke="url(#frostSkyCobalt)" 
          stroke-width="32" 
          stroke-linecap="round" />

    <!-- Bottom-Left Arrow Head -->
    <path d="M 327 357 L 302 297 L 257 332 Z" 
          fill="url(#frostSkyCobalt)" />

    <!-- Central Fusion Dot -->
    <circle cx="256" cy="256" r="16" fill="#ECEFF4" />
    <circle cx="256" cy="256" r="8" fill="#88C0D0" />
  </g>
</svg>
