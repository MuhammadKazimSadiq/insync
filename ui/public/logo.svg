<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E3440" />
      <stop offset="100%" stop-color="#1E222A" />
    </linearGradient>

    <!-- Squircle Border Highlight -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88C0D0" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4C566A" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#2E3440" stop-opacity="0.2" />
    </linearGradient>

    <!-- Upper Flow: Frost Teal -> Ice Cyan -> Snow White -->
    <linearGradient id="upperSyncGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#88C0D0" />
      <stop offset="50%" stop-color="#8FBCBB" />
      <stop offset="100%" stop-color="#ECEFF4" />
    </linearGradient>

    <!-- Lower Flow: Deep Frost -> Nord Cobalt -> Sky Blue -->
    <linearGradient id="lowerSyncGrad" x1="100%" y1="100%" x2="0%" y2="20%">
      <stop offset="0%" stop-color="#4C6D96" />
      <stop offset="50%" stop-color="#5E81AC" />
      <stop offset="100%" stop-color="#81A1C1" />
    </linearGradient>
  </defs>

  <!-- Base Apple-style Squircle with Crisp Border -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3.5" />

  <!-- TOP-RIGHT SYNC ARROW (Clockwise upper arc) -->
  <g>
    <!-- Sweeping Arc -->
    <path d="M 124 212 A 136 136 0 0 1 386 218"
          fill="none"
          stroke="url(#upperSyncGrad)"
          stroke-width="44"
          stroke-linecap="round" />

    <!-- Arrowhead (Seamless, Bold, Aerodynamic) -->
    <path d="M 424 208 L 402 278 L 350 228 Z"
          fill="#ECEFF4"
          stroke="#ECEFF4"
          stroke-width="4"
          stroke-linejoin="round" />
  </g>

  <!-- BOTTOM-LEFT SYNC ARROW (Clockwise lower arc, 180° symmetric) -->
  <g>
    <!-- Sweeping Arc -->
    <path d="M 388 300 A 136 136 0 0 1 126 294"
          fill="none"
          stroke="url(#lowerSyncGrad)"
          stroke-width="44"
          stroke-linecap="round" />

    <!-- Arrowhead (Seamless, Bold, Aerodynamic) -->
    <path d="M 88 304 L 110 234 L 162 284 Z"
          fill="#81A1C1"
          stroke="#81A1C1"
          stroke-width="4"
          stroke-linejoin="round" />
  </g>
</svg>
