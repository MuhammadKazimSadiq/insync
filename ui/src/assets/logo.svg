<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Nord Polar Night base -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E3440" />
      <stop offset="100%" stop-color="#1E222A" />
    </linearGradient>

    <!-- Squircle Border Highlight: Nord Frost Cyan to Muted Slate -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88C0D0" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4C566A" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#2E3440" stop-opacity="0.2" />
    </linearGradient>

    <!-- Upper Flow: Nord Frost Polar Mint -> Ice Cyan -> Snow White -->
    <linearGradient id="upperSyncGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FBCBB" />
      <stop offset="50%" stop-color="#88C0D0" />
      <stop offset="100%" stop-color="#ECEFF4" />
    </linearGradient>

    <!-- Lower Flow: Nord Arctic Cobalt -> Glacial Blue -> Ice Cyan -->
    <linearGradient id="lowerSyncGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#5E81AC" />
      <stop offset="60%" stop-color="#81A1C1" />
      <stop offset="100%" stop-color="#88C0D0" />
    </linearGradient>
  </defs>

  <!-- Base Apple-style Squircle with Crisp Border -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3.5" />

  <!-- Subtle Precision Guide Track -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#3B4252" stroke-width="3" stroke-dasharray="8 8" opacity="0.6" />

  <!-- TOP-RIGHT SYNC ARROW (Clockwise upper arc) -->
  <g>
    <path d="M 132 230 A 136 136 0 0 1 380 216"
          fill="none"
          stroke="url(#upperSyncGrad)"
          stroke-width="40"
          stroke-linecap="round" />

    <polygon points="384,168 434,236 348,244"
             fill="#ECEFF4"
             stroke="#ECEFF4"
             stroke-width="3"
             stroke-linejoin="round" />
  </g>

  <!-- BOTTOM-LEFT SYNC ARROW (Clockwise lower arc, 180° symmetric) -->
  <g>
    <path d="M 380 282 A 136 136 0 0 1 132 296"
          fill="none"
          stroke="url(#lowerSyncGrad)"
          stroke-width="40"
          stroke-linecap="round" />

    <polygon points="128,344 78,276 164,268"
             fill="#81A1C1"
             stroke="#81A1C1"
             stroke-width="3"
             stroke-linejoin="round" />
  </g>

  <!-- Central Precision Nexus Core -->
  <circle cx="256" cy="256" r="20" fill="#2E3440" stroke="#88C0D0" stroke-width="6" />
  <circle cx="256" cy="256" r="7" fill="#ECEFF4" />
</svg>
